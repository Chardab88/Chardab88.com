name: Update Driver Stats

on:
  schedule:
    - cron: '0 10 * * 2'  # Every Tuesday 10am UTC (Monday night race results are in)
  workflow_dispatch:        # Lets you also run it manually from GitHub

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run stats updater
        run: python update_stats.py

      - name: Commit and push if changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add drivers.json easy_drivers.json hilodriv.json
          git diff --staged --quiet || git commit -m "Auto update driver stats $(date +'%Y-%m-%d')"
          git push
